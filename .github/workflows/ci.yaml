name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      INVENTROSPECT_IMAGE: inventrospect:local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: go mod download && go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build ./cmd/server ./cmd/mcp ./cmd/ops
      - run: go build -o /tmp/inventrospect-mcp ./cmd/mcp
      - run: INVENTROSPECT_MCP_TEST_BINARY=/tmp/inventrospect-mcp go test ./internal/mcpserver -run TestStdioBinary -count=1
      - run: node --test internal/web/explorer.test.cjs
      - run: docker compose config --quiet
      - run: docker compose build app
      - run: bash scripts/container-smoke.sh
